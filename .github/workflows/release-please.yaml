# .github/workflows/release-please.yml
name: release-please
on:
  push:
    branches:
      - main
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: google-github-actions/release-please-action@v3.7.12
        with:
          release-type: terraform-module # Multiple release types are supported
          default-branch: main

      # Merge the release PR as soon as it is opened or updated. GITHUB_TOKEN can't do it:
      # the main ruleset requires a review and GitHub doesn't allow the GitHub Actions app
      # on an org repo's bypass list. RELEASE_MERGE_TOKEN is a fine-grained token (this repo,
      # contents + pull requests write) from an admin, who is on the bypass list.
      - name: Merge release PR
        id: merge
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_MERGE_TOKEN }}
          PR_NUMBER: ${{ fromJSON(steps.release.outputs.pr).number }}
        run: gh pr merge "$PR_NUMBER" --squash --admin --repo "$GITHUB_REPOSITORY"

      # A merge made with GITHUB_TOKEN does not trigger another workflow run,
      # so tag and publish the release from this run.
      - name: Tag and publish release
        if: steps.merge.outcome == 'success'
        uses: google-github-actions/release-please-action@v3.7.12
        with:
          release-type: terraform-module
          default-branch: main
